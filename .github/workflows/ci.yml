name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  backend:
    name: Backend lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://docintel:docintel@localhost:5432/docintel_test
      TEST_DATABASE_URL: postgresql+asyncpg://docintel:docintel@localhost:5432/docintel_test
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - run: uv run alembic downgrade base && uv run alembic upgrade head

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    name: Compose config and container health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate self-hosted distribution
        shell: pwsh
        run: |
          bash -n scripts/setup.sh
          foreach ($script in 'scripts/setup.ps1', 'scripts/start-windows.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          docker compose -f docker-compose.yml -f docker-compose.local-ai.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local-ai.yml -f docker-compose.gpu.yml config --quiet
          $env:LAN_ADDRESS = '192.168.1.10'
          $env:LAN_SUBNET = '192.168.1.0/24'
          docker compose -f docker-compose.yml -f docker-compose.lan.yml config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8000/health/ready && curl --fail http://localhost:3000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
