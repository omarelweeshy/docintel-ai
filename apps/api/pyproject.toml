[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.148.0,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.16.0,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1", "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2",
  "python-docx>=1.1.2,<2", "openai>=1.68,<3", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
# Optional CPU models (rerankers, claim verifiers): uv sync --group ml
ml = ["torch>=2.8,<3", "transformers>=5.10,<6"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["pgvector.*", "pymupdf.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../../evals/tests"]
# The eval harness lives at the repository root and imports the app package.
pythonpath = ["../.."]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable pgvector database"]
